# dsh-inspect profile bundle patch (declared by the `dsh.bundle.patch`
# manifest field): inserts the checkup/fix/review rows into any profile that
# lists @dsh-external/dsh-inspect in its `dsh.profile.bundles`.
# The row loads the plugin by package name from the profile's node_modules.
#
# Runtime requirement: the profile's composition must provide the `workflows`
# service (official workflow engine, @deepseek-ai/dsh-workflow — bundled with
# the official base compositions). In compositions without a workflows
# provider (e.g. the standard web composition) the plugin deliberately does
# NOT wait via static inject (that left the entry pending forever and hung
# the whole profile); it fails fast at activation with an actionable error
# instead, leaving every other plugin untouched.

- insert:
    - id: dsh-inspect
      name: '@dsh-external/dsh-inspect'
