# Host-level mount — NOT loaded by default. The bundle patch is
# presets/standard-inspect.patch.yml, which mounts dsh-inspect inside an agent
# preset next to that preset's own workflow engine (the dsh web app way).
#
# Use this only for a profile without agent presets (e.g. a TUI/headless
# profile whose agent is composed host-wide): copy the rows below into that
# profile's cordis.patch.yml. The host composition must then provide the
# workflow engine (`workflow-ptc`, service `workflowEngine`) — on the web
# profile it is disabled at host level, and tools mounted here would ALSO
# appear in every preset next to the preset-mounted copy, so don't do both.

- insert:
    - id: dsh-inspect
      name: '@dsh-external/dsh-inspect'
